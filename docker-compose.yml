services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт наружу не открываем: база доступна только контейнерам api и bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # В .env для локальной разработки указан localhost — в Docker база живёт в контейнере db
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    # Только для самого сервера: снаружи админка открывается через Caddy (HTTPS) или SSH-туннель
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: python -m app.bot.main
    # Ждём, пока api применит миграции базы
    depends_on:
      api:
        condition: service_healthy

  # HTTPS для админки по домену. Включается: docker compose --profile https up -d
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["https"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
